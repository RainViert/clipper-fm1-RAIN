name: release
on:
  push:
    tags: ['v*']
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: >-
        git submodule update --init --recursive &&
        python3 -m pip install fonttools &&
        V="${GITHUB_REF_NAME#v}" && B="${V%%-*}" && R="$(printf %s "${V#"$B"}" | tr -d -)" &&
        sh ./build.sh --release "$B${R:+-$R}"
      packages: build/*.fwsc
